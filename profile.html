<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social - Profile</title>
  <meta name="description" content="View user profile on Social.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header-content">
      <div class="header-left">
        <a href="index.html" class="back-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <div class="flex flex-col">
          <span id="header-title" class="text-lg font-semibold">Profile</span>
          <span id="header-post-count" class="text-xs" style="color: var(--muted-foreground);">0 posts</span>
        </div>
      </div>
      <div class="header-right">
        <button id="logout-btn" class="header-icon-btn" title="Logout" onclick="api.logout()" class="logout-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container" style="padding-top: 1.5rem; padding-bottom: 2rem;">
    <div class="max-w-xl space-y-4">
      <!-- Profile Card -->
      <div class="profile-card" id="profile-container">
        <div class="profile-header">
          <img id="profile-avatar" src="" alt="Profile" class="profile-avatar">
          <button id="follow-btn" class="btn btn-sm btn-follow" style="display: none;">Follow</button>
        </div>

        <h1 id="profile-name" class="profile-name"></h1>
        <p id="profile-handle" class="profile-handle"></p>
        <p id="profile-bio" class="profile-bio"></p>

        <!-- Stats -->
        <div class="profile-stats">
          <div>
            <span id="posts-count" class="profile-stat-value">0</span>
            <span class="profile-stat-label">Posts</span>
          </div>
          <div>
            <span id="followers-count" class="profile-stat-value">0</span>
            <span class="profile-stat-label">Followers</span>
          </div>
          <div>
            <span id="following-count" class="profile-stat-value">0</span>
            <span class="profile-stat-label">Following</span>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <div class="tabs-list">
          <button class="tab-btn active" data-tab="posts">Posts</button>
          <button class="tab-btn" data-tab="media">Media</button>
        </div>

        <div id="tab-posts" class="tab-content active">
          <div id="profile-posts" class="space-y-4">
            <!-- Posts will be rendered here -->
          </div>
        </div>

        <div id="tab-media" class="tab-content">
          <div class="card" style="padding: 2rem; text-align: center;">
            <p style="color: var(--muted-foreground);">No media yet</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initProfilePage();
      initTabs();
    });
  </script>
</body>
</html>
