<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social - Create Account</title>
  <meta name="description" content="Create a Social account to connect with friends and share your thoughts.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="card card-auth">
        <!-- Icon -->
        <div class="auth-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        </div>

        <!-- Title -->
        <h1 class="auth-title">Create Account</h1>

        <!-- Form -->
        <form onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" class="form-input" placeholder="Choose a username" required>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Create a password" required>
          </div>

          <div class="form-group">
            <label for="bio" class="form-label">
              Short Bio <span class="form-label-optional">(optional)</span>
            </label>
            <textarea id="bio" class="form-input form-textarea" placeholder="Tell us about yourself..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
            Sign up
          </button>
        </form>

        <!-- Login link -->
        <a href="login.html" class="auth-link">
          Already have an account? Log in
        </a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // If already logged in, redirect to home
    document.addEventListener('DOMContentLoaded', function() {
      if (checkAuth()) {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
