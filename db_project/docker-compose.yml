services:
  mongodb:
    image: mongo:latest
    ports: ["27017:27017"]

  redis:
    image: redis:latest
    ports: ["6379:6379"]

  neo4j:
    image: neo4j:latest
    ports: ["7474:7474", "7687:7687"]
    environment:
      - NEO4J_AUTH=neo4j/password123

  cassandra:
    image: cassandra:latest
    ports: ["9042:9042"]
