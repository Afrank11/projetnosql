<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social - Login</title>
  <meta name="description" content="Log in to Social to connect with friends and share your thoughts.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="card card-auth">
        <!-- Icon -->
        <div class="auth-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        </div>

        <!-- Title -->
        <h1 class="auth-title">Welcome Back</h1>

        <!-- Form -->
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
            Sign in
          </button>
        </form>

        <!-- Register link -->
        <a href="register.html" class="auth-link">
          Don't have an account? Sign up
        </a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // If already logged in, redirect to home
    document.addEventListener('DOMContentLoaded', function() {
      if (checkAuth()) {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
