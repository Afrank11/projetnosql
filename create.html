<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social - Create Post</title>
  <meta name="description" content="Share your thoughts with the Social community.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header-content">
      <button id="cancel-btn" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <button id="post-btn" class="btn btn-primary btn-sm" disabled onclick="handleCreatePost()">Post</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container" style="padding-top: 1.5rem;">
    <div class="max-w-xl">
      <textarea 
        id="post-content" 
        class="create-textarea" 
        placeholder="What's on your mind?"
        autofocus
      ></textarea>

      <!-- Image Upload Section -->
      <div class="image-upload-section">
        <input type="file" id="image-input" accept="image/*" hidden>
        <button type="button" id="add-image-btn" class="btn-add-image">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>Add Image</span>
        </button>
        
        <!-- Image Preview -->
        <div id="image-preview-container" class="image-preview-container" style="display: none;">
          <img id="image-preview" src="" alt="Preview" class="image-preview">
          <button type="button" id="remove-image-btn" class="btn-remove-image">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- Character counter -->
      <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
        <span id="char-counter" class="char-counter">280</span>
      </div>

      <!-- Progress bar -->
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initCreatePostPage);
  </script>
</body>
</html>
